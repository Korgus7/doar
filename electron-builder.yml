# Balík Doar pre Windows (electron-builder). Zostavenie: npm run dist → dist\Doar-<verzia>-win-x64.zip
#
# Prečo nie inštalátor (.exe): Windows (inteligentná kontrola aplikácií) blokuje nepodpísané programy,
# ktoré nepozná. Originálny Electron pozná a púšťa – preto ho necháme bit po bite nezmenený
# (bez vloženej ikony a bez kontrolného súčtu asar) a len ho premenujeme na „Doar.exe“.
# Ikonu v ponuke Štart a na ploche si Doar vytvorí sám pri prvom spustení (odkazy s vlastnou ikonou).
# Podpísaný inštalátor príde, keď bude certifikát.
appId: sk.doar.app
productName: Doar
copyright: Copyright © 2026 Milan Caputa
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - "!**/*.map"
  # pst-extractor obsahuje ukážkové súbory (~46 MB) – do balíka nepatria.
  - "!node_modules/pst-extractor/example/**"
# Ikona pre odkazy v ponuke Štart a na ploche – musí byť skutočný súbor (nie v app.asar).
extraResources:
  - from: build/icon.ico
    to: icon.ico
# Bez natívnych modulov (SQLite je súčasť Electronu) – netreba nič kompilovať.
npmRebuild: false
asar: true
# Kontrolný súčet asar by sa zapísal do .exe a zmenil ho – Windows by ho potom nepoznal.
disableAsarIntegrity: true
win:
  # .exe zostane originálny Electron (žiadna úprava ikony ani podpis).
  signAndEditExecutable: false
  target:
    - target: zip
      arch: [x64]
  artifactName: Doar-${version}-win-${arch}.${ext}
# Balík pre Microsoft Store (npm run dist:store → dist\*.appx). Podpisuje ho Store, preto ho Windows neblokuje.
# Verzia zo Store sa aktualizuje cez Store (vlastné aktualizácie a odkazy sa v nej vypnú – process.windowsStore).
# identityName, publisher a publisherDisplayName sú z Partner Center (Doar → Product identity).
# Jazyky = jazyky stránky v obchode (pre každý treba popis) – stačí slovenčina a angličtina; Doar sám vie všetky.
appx:
  identityName: Doar.Doar
  publisher: CN=9748EE6F-30C8-4ADD-A1BA-C275E81B3B81
  publisherDisplayName: Doar
  applicationId: Doar
  displayName: Doar
  backgroundColor: transparent
  languages: [sk-SK, en-US]
  artifactName: Doar-${version}-store.${ext}
# Mac (npm run dist:mac – len na Macu; na GitHube to robí .github/workflows/mac.yml).
# Bez certifikátu Apple: identity null a podpis ad-hoc (scripts/adhoc-sign.cjs). Aktualizácia na Macu
# = odkaz na stránku vydania (sama sa nainštalovať nedá). Nový Mac (arm64) aj starší s Intelom (x64).
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  icon: build/icon.png
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: Doar-${version}-mac-${arch}.${ext}
afterSign: scripts/adhoc-sign.cjs
dmg:
  artifactName: Doar-${version}-mac-${arch}.${ext}
