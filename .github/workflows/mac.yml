# Zostavenie Doar pre Mac (na Macu od GitHubu, zadarmo pre verejný repozitár).
# - Ručne: Actions → Mac → Run workflow → hotové .dmg sú v „Artifacts“ (doar-mac).
# - Pri vydaní (Publish release) sa .dmg samo priloží k vydaniu.
# Bez certifikátu Apple: program je podpísaný len „ad-hoc“ – pri prvom spustení treba
# Nastavenia → Súkromie a bezpečnosť → „Aj tak otvoriť“.
name: Mac

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: doar-mac
          path: dist/*.dmg
          if-no-files-found: error
      - name: Priložiť k vydaniu
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.dmg --clobber
